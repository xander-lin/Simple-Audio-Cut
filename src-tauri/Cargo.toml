[package]
name = "simple-audio-cut"
version = "0.2.0"
description = "Fast spoken-word recording and audio editing"
license = "GPL-3.0-only"
repository = "https://github.com/xander-lin/Simple-Audio-Cut"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simple_audio_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
simple-audio-cut-core = { path = "../crates/core", default-features = false }

[features]
default = ["native-audio", "clearvoice-denoise"]
native-audio = ["simple-audio-cut-core/native-audio"]
clearvoice-denoise = ["simple-audio-cut-core/clearvoice-denoise"]
mock-audio = []
custom-protocol = ["tauri/custom-protocol"]
