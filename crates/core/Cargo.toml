[package]
name = "simple-audio-cut-core"
version = "0.2.0"
description = "Audio engine, denoising and editing model for Simple Audio Cut"
license = "GPL-3.0-only"
repository = "https://github.com/xander-lin/Simple-Audio-Cut"
edition = "2021"

[dependencies]
cpal = { version = "0.15", optional = true }
ffmpeg-next = { version = "9", optional = true }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["native-audio", "clearvoice-denoise"]
native-audio = ["dep:cpal", "dep:ffmpeg-next"]
clearvoice-denoise = []
